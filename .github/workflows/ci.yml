name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # build number comes from the commit count
          persist-credentials: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Toolchain
        run: |
          swift --version
          openssl version || true

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/build-app.sh --universal

      - name: Package development build
        run: ditto -c -k --sequesterRsrc --keepParent "build/Cert Lab.app" build/Cert-Lab-development-universal.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cert-Lab-development-universal
          path: build/Cert-Lab-development-universal.zip
          if-no-files-found: error
          retention-days: 14
