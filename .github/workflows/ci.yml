name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build number comes from the commit count

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Toolchain
        run: |
          swift --version
          openssl version || true

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/build-app.sh --universal

      - name: Package development build
        run: ditto -c -k --sequesterRsrc --keepParent "build/Cert Lab.app" build/Cert-Lab-development-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cert-Lab-development-universal
          path: build/Cert-Lab-development-universal.zip
          if-no-files-found: error
          retention-days: 14
