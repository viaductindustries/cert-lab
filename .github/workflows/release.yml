name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
    # Apple credentials come from the release environment, not the caller.
    secrets:
      HOMEBREW_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, sign & notarize
    runs-on: macos-26
    # Holds the Apple signing secrets; only runs from main.
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release must run on a vX.Y.Z tag matching version.txt." >&2
            exit 1
          fi

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG"

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # Build from scratch, without restoring caches from pull requests.
      - name: Build universal app
        run: scripts/build-app.sh --universal

      - name: Sign, notarize & package
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: scripts/notarize-app.sh

      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization
          path: build/notarization/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach notarized downloads
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Upload without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          mkdir existing
          # Check every existing asset before uploading any new files.
          for file in release/*; do
            name="$(basename "$file")"
            if grep -Fxq "$name" existing-assets.txt; then
              gh release download "$TAG" --pattern "$name" --dir existing
              if ! cmp -s "$file" "existing/$name"; then
                echo "Refusing to replace published asset: $name. Release a new version instead." >&2
                exit 1
              fi
            fi
          done
          for file in release/*; do
            name="$(basename "$file")"
            if ! grep -Fxq "$name" existing-assets.txt; then
              gh release upload "$TAG" "$file"
            fi
          done

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    permissions:
      contents: read
    uses: viaductindustries/homebrew-tap/.github/workflows/update-package.yml@b71ffff060bdd3e1d6235c572177f7bb3846bd24
    with:
      package: cert-lab
      tag: ${{ inputs.tag }}
      app-client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
    secrets:
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
